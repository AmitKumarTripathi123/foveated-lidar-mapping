version: 1.0.0
model_type: spvcnn
architecture:
  name: "Sparse Point-Voxel Convolutional Neural Network (SPVCNN)"
  reference: "Tang et al., ECCV 2020"
  in_channels: 4
  base_channels: 32
  num_classes: 19
  voxel_size: 0.05
  dropout: 0.1
weights:
  pretrained_checkpoint: "checkpoints/spvcnn_pretrained.pt"
  source_dataset: "SemanticKITTI"
  target_dataset: "SemanticPOSS"
  ontology:
    native_classes: 19
    superclasses: 4
    ignore_label: 255
inference:
  device: "cpu"
  voxel_size: 0.05
  batch_size: 1
